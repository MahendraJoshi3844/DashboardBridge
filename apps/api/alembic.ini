; Alembic configuration for DashboardBridge AI.
;
; Run from the repository root:
;
;     alembic -c apps/api/alembic.ini upgrade head
;
; `sqlalchemy.url` is deliberately empty. The URL comes from `DATABASE_URL` via
; app.core.db, so a credential never lives in a checked-in file (§53). Set it
; here only by overriding it programmatically, which is what the tests do to
; point a migration at a temporary SQLite file.

[alembic]
script_location = %(here)s/alembic
path_separator = os
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
