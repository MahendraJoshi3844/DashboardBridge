# Tableau calculation functions that translate to DAX by direct
# substitution at the same arity.
#
# Every entry is a rule with an id, because a translation has to be able to
# cite the rule that produced it - that citation is the audit trail's answer
# to "why is this DAX what it is".
#
# Adding a function here is the supported way to grow coverage. Removing one
# silently narrows it, which is why the loader refuses a malformed pack
# rather than skipping the entry.

functions:
  - rule_id: TABLEAU_ABS_TO_PBI_ABS
    version: 1
    source: ABS
    target: ABS
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_AVG_TO_PBI_AVERAGE
    version: 1
    source: AVG
    target: AVERAGE
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_CEILING_TO_PBI_CEILING
    version: 1
    source: CEILING
    target: CEILING
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_CONTAINS_TO_PBI_CONTAINSSTRING
    version: 1
    source: CONTAINS
    target: CONTAINSSTRING
    strategy: deterministic
    confidence: 1.0
    note: Tableau's CONTAINS is a substring test, not DAX's table CONTAINS.
  - rule_id: TABLEAU_COUNT_TO_PBI_COUNT
    version: 1
    source: COUNT
    target: COUNT
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_COUNTD_TO_PBI_DISTINCTCOUNT
    version: 1
    source: COUNTD
    target: DISTINCTCOUNT
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_DATEDIFF_TO_PBI_DATEDIFF
    version: 1
    source: DATEDIFF
    target: DATEDIFF
    strategy: deterministic
    confidence: 1.0
    note: Argument order differs; the translator reorders them.
  - rule_id: TABLEAU_DAY_TO_PBI_DAY
    version: 1
    source: DAY
    target: DAY
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_FLOOR_TO_PBI_FLOOR
    version: 1
    source: FLOOR
    target: FLOOR
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_ISNULL_TO_PBI_ISBLANK
    version: 1
    source: ISNULL
    target: ISBLANK
    strategy: deterministic
    confidence: 1.0
    note: DAX has no ISNULL; ISBLANK is the equivalent test.
  - rule_id: TABLEAU_LEFT_TO_PBI_LEFT
    version: 1
    source: LEFT
    target: LEFT
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_LEN_TO_PBI_LEN
    version: 1
    source: LEN
    target: LEN
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_LOWER_TO_PBI_LOWER
    version: 1
    source: LOWER
    target: LOWER
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_MAX_TO_PBI_MAX
    version: 1
    source: MAX
    target: MAX
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_MEDIAN_TO_PBI_MEDIAN
    version: 1
    source: MEDIAN
    target: MEDIAN
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_MID_TO_PBI_MID
    version: 1
    source: MID
    target: MID
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_MIN_TO_PBI_MIN
    version: 1
    source: MIN
    target: MIN
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_MONTH_TO_PBI_MONTH
    version: 1
    source: MONTH
    target: MONTH
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_NOW_TO_PBI_NOW
    version: 1
    source: NOW
    target: NOW
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_RIGHT_TO_PBI_RIGHT
    version: 1
    source: RIGHT
    target: RIGHT
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_ROUND_TO_PBI_ROUND
    version: 1
    source: ROUND
    target: ROUND
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_STDEV_TO_PBI_STDEV_S
    version: 1
    source: STDEV
    target: STDEV.S
    strategy: deterministic
    confidence: 1.0
    note: Sample standard deviation, matching Tableau's default.
  - rule_id: TABLEAU_SUM_TO_PBI_SUM
    version: 1
    source: SUM
    target: SUM
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_TODAY_TO_PBI_TODAY
    version: 1
    source: TODAY
    target: TODAY
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_TRIM_TO_PBI_TRIM
    version: 1
    source: TRIM
    target: TRIM
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_UPPER_TO_PBI_UPPER
    version: 1
    source: UPPER
    target: UPPER
    strategy: deterministic
    confidence: 1.0
  - rule_id: TABLEAU_VAR_TO_PBI_VAR_S
    version: 1
    source: VAR
    target: VAR.S
    strategy: deterministic
    confidence: 1.0
    note: Sample variance, matching Tableau's default.
  - rule_id: TABLEAU_YEAR_TO_PBI_YEAR
    version: 1
    source: YEAR
    target: YEAR
    strategy: deterministic
    confidence: 1.0
