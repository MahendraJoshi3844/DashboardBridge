[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboardbridge-contracts"
version = "0.1.0"
description = "Shared API and canonical-model contracts for DashboardBridge AI."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]
