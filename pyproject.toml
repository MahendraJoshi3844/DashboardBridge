[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboardbridge"
version = "0.1.0"
description = "DashboardBridge: one UI and API over separately sold BI migration engines (Tableau, MicroStrategy, Qlik to Power BI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mahendra Joshi", email = "mahendra.joshi@atos.net" }]
dependencies = [
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Ed25519, for offline licence signatures. Was already installed and
    # undeclared, which is the kind of dependency that works until a clean
    # install on a customer's machine.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]
# Engines sold separately, each in its own repository and pinned by commit so a
# deployment converts the same way every time. Install the ones a customer has:
#   pip install ".[tableau]"   pip install ".[microstrategy]"   pip install ".[qlik]"   pip install ".[engines]"
# Without them the matching migration cards show as "not installed" and the API
# refuses those directions (engines/conversion/directions.py).
# For development against local clones: pip install -e ../Tableau-to-Power-BI (and the others)
tableau = ["t2pbi @ git+https://github.com/MahendraJoshi3844/Tableau-to-Power-BI@26012c182e157b37229f2e20e1523faff9a998e1"]
microstrategy = ["mstr2pbi @ git+https://github.com/MahendraJoshi3844/MicroStrategy-to-Power-BI@3852d73b75a07efed2f3904612b2cb859a4784af"]
qlik = ["qlik2pbi @ git+https://github.com/MahendraJoshi3844/Qlik-To-PowerBI@7e1e69d25ef66be188143270408e3f358e74804d"]
engines = [
    "t2pbi @ git+https://github.com/MahendraJoshi3844/Tableau-to-Power-BI@26012c182e157b37229f2e20e1523faff9a998e1",
    "mstr2pbi @ git+https://github.com/MahendraJoshi3844/MicroStrategy-to-Power-BI@3852d73b75a07efed2f3904612b2cb859a4784af",
    "qlik2pbi @ git+https://github.com/MahendraJoshi3844/Qlik-To-PowerBI@7e1e69d25ef66be188143270408e3f358e74804d",
]

[project.scripts]
dashboardbridge-license = "engines.licensing.cli:main"

# The engine moved under `engines/` (`P2.1`), so there is no `src/` layout
# any more: `engines` is a package at the repository root and every engine -
# the converter, the adapters, the validator, the AI layer - is a subpackage
# of it. One import root instead of two.
[tool.setuptools.packages.find]
where = ["."]
include = ["engines*"]

# The translation rule pack is data, and data is not shipped by default. Without
# this an installed t2pbi has no rules: the loader refuses the pack and the
# engine converts nothing, in a build that looked fine locally.
[tool.setuptools.package-data]
"engines.tableau_calc" = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
